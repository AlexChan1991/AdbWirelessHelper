# Gradle 守护进程参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX 必需开关
android.useAndroidX=true

# 只生成自己模块的 R 类字段，减少 R 类体积与冲突
android.nonTransitiveRClass=true

# Kotlin 官方代码风格
kotlin.code.style=official

# JDK 位置登记（帮助 Gradle 工具链自动发现）。
# 本机当前仅安装 JDK 21，AGP 8.7 / Gradle 8.9 官方支持 JDK 21；
# 若你另外装了 JDK 17，在下面用英文分号追加路径即可（多个用 ; 分隔，路径用正斜杠）：
#   org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21.0.10;D:/jdk-17
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21.0.10

# 若将来某个任务确实强制要求 JDK 17 而你不想装，可启用 fooay 自动下载（需要联网）：
#   在 settings.gradle.kts 的 plugins 块加
#   id("org.gradle.toolchains.foojay-resolver-convention") version "0.9.0"
